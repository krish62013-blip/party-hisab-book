<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Hisab Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f0f4ff; --bg-card: #ffffff; --bg-subtle: #f5f8ff; --bg-header: rgba(255,255,255,0.92);
      --bg-input: #ffffff; --border-card: #e1e8f8; --border-subtle: #edf2fc; --border-input: #cbd5e1;
      --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #64748b;
    }
    html.dark {
      --bg-app: #080d1a; --bg-card: #111827; --bg-subtle: #192236; --bg-header: rgba(11,17,32,0.92);
      --bg-input: #0b1120; --border-card: #1f2b42; --border-subtle: #182236; --border-input: #2c3b59;
      --text-primary: #f8fafc; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-app); color: var(--text-primary); margin: 0; }
    .app-card { background-color: var(--bg-card); border: 1px solid var(--border-card); }
    .app-subtle { background-color: var(--bg-subtle); border: 1px solid var(--border-subtle); }
    .app-input { background-color: var(--bg-input); border: 1px solid var(--border-input); color: var(--text-primary); }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media print { .no-print { display: none !important; } body { background: #fff !important; color: #000 !important; } }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div id="app"></div>
  <iframe name="gs_hidden_iframe" id="gs_hidden_iframe" style="display:none;"></iframe>

  <script>
    (function () {
      const STORAGE_KEY = 'party_hisab_book_v4';
      const SYNC_URL_KEY = 'party_hisab_gs_url';
      const THEME_KEY = 'party_hisab_theme';

      const defaultState = {
        activePartyId: 'party_1', activeTab: 'ledger',
        parties: [{ id: 'party_1', name: 'Party A - Shri Balaji Traders', city: 'Ranchi', phone: '98351 44210' }],
        mainLedger: [{ id: 'led_101', partyId: 'party_1', date: '2026-11-18', type: 'RECEIVED', amount: 2500000, mode: 'RTGS', ref: 'HDFCR520261118001', notes: 'Advance inward' }],
        upiTargets: [], upiPayouts: [], finalizedBatches: [], settlements: []
      };

      let state = (() => {
        try { return Object.assign({}, defaultState, JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {}); }
        catch (e) { return JSON.parse(JSON.stringify(defaultState)); }
      })();

      let syncUrl = localStorage.getItem(SYNC_URL_KEY) || '';
      let syncStatus = syncUrl ? 'Saved URL' : 'Local Mode';
      let lastSyncTime = 'Not synced yet';
      let isSyncModalOpen = false;
      let isAddPartyModalOpen = false;
      let isSyncing = false;

      if (localStorage.getItem(THEME_KEY) === 'dark') document.documentElement.classList.add('dark');

      const saveLocal = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} };
      const formatINR = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');
      const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const getActiveParty = () => state.parties.find(p => p.id === state.activePartyId) || state.parties[0];

      // ZERO-CORS JSONP GET REQUEST
      function jsonpGet(action) {
        return new Promise((resolve, reject) => {
          const url = String(syncUrl || '').trim();
          if (!url) return reject(new Error('Enter Web App URL first'));
          const cbName = 'gs_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          const script = document.createElement('script');
          const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout: Check Web App URL & "Anyone" permission')); }, 12000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = function (data) {
            cleanup();
            resolve(data);
          };

          script.onerror = function () {
            cleanup();
            reject(new Error('Failed to load script. Ensure access is set to "Anyone".'));
          };

          const sep = url.indexOf('?') === -1 ? '?' : '&';
          script.src = url + sep + 'action=' + encodeURIComponent(action) + '&callback=' + cbName + '&_t=' + Date.now();
          document.body.appendChild(script);
        });
      }

      // ZERO-CORS HIDDEN FORM POST REQUEST
      function formPost(payloadObj) {
        return new Promise((resolve, reject) => {
          const url = String(syncUrl || '').trim();
          if (!url) return reject(new Error('Enter Web App URL first'));

          const form = document.createElement('form');
          form.method = 'POST';
          form.action = url;
          form.target = 'gs_hidden_iframe';
          form.style.display = 'none';

          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'payload';
          input.value = JSON.stringify(payloadObj);

          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();

          setTimeout(() => {
            if (form.parentNode) form.parentNode.removeChild(form);
            resolve({ ok: true });
          }, 1800);
        });
      }

      async function testConnection() {
        isSyncing = true; syncStatus = 'Connecting...'; render();
        try {
          const res = await jsonpGet('ping');
          if (res && res.ok) {
            localStorage.setItem(SYNC_URL_KEY, syncUrl.trim());
            syncStatus = 'Connected';
            lastSyncTime = new Date().toLocaleTimeString();
          } else {
            syncStatus = 'Error: ' + ((res && res.error) || 'Unknown');
          }
        } catch (e) {
          syncStatus = e.message;
        }
        isSyncing = false; render();
      }

      async function pushToSheet() {
        isSyncing = true; syncStatus = 'Pushing...'; render();
        try {
          await formPost({
            action: 'pushAll',
            data: {
              parties: state.parties, mainLedger: state.mainLedger,
              upiTargets: state.upiTargets, upiPayouts: state.upiPayouts,
              finalizedBatches: state.finalizedBatches, settlements: state.settlements
            }
          });
          localStorage.setItem(SYNC_URL_KEY, syncUrl.trim());
          syncStatus = 'Connected & Synced';
          lastSyncTime = new Date().toLocaleTimeString();
        } catch (e) {
          syncStatus = e.message;
        }
        isSyncing = false; render();
      }

      async function pullFromSheet() {
        isSyncing = true; syncStatus = 'Pulling...'; render();
        try {
          const res = await jsonpGet('pull');
          if (res && res.ok && res.data) {
            if (res.data.parties && res.data.parties.length) {
              state.parties = res.data.parties;
              if (!state.parties.some(p => p.id === state.activePartyId)) state.activePartyId = state.parties[0].id;
            }
            state.mainLedger = res.data.mainLedger || [];
            state.upiTargets = res.data.upiTargets || [];
            state.upiPayouts = res.data.upiPayouts || [];
            state.finalizedBatches = res.data.finalizedBatches || [];
            state.settlements = res.data.settlements || [];
            saveLocal();
            syncStatus = 'Pulled Latest Sheet';
            lastSyncTime = new Date().toLocaleTimeString();
          } else {
            syncStatus = 'Error: ' + ((res && res.error) || 'Pull failed');
          }
        } catch (e) {
          syncStatus = e.message;
        }
        isSyncing = false; render();
      }

      function autoSync() {
        saveLocal();
        if (syncUrl && syncStatus.indexOf('Connected') !== -1) pushToSheet();
      }

      function computeMetrics(partyId) {
        const ledger = state.mainLedger.filter(x => x.partyId === partyId);
        const targets = state.upiTargets.filter(x => x.partyId === partyId);
        const payouts = state.upiPayouts.filter(x => x.partyId === partyId);
        const rec = ledger.filter(x => x.type === 'RECEIVED').reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const ret = ledger.filter(x => x.type === 'RETURNED').reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const openPaid = payouts.filter(x => x.status !== 'FINALIZED').reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const openTgt = targets.filter(x => x.status !== 'FINALIZED').reduce((s, x) => s + (Number(x.targetAmount) || 0), 0);
        return { rec, ret, mainOS: rec - ret, openPaid, openTgt, netOS: (rec - ret) - openPaid, ledger, targets, payouts };
      }

      function render() {
        const party = getActiveParty();
        const m = computeMetrics(party.id);
        const isDark = document.documentElement.classList.contains('dark');
        const isOk = syncStatus.indexOf('Connected') !== -1 || syncStatus.indexOf('Pulled') !== -1;

        document.getElementById('app').innerHTML = `
          <header class="sticky top-0 z-30 border-b backdrop-blur-md no-print" style="background: var(--bg-header); border-color: var(--border-card);">
            <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-sm">HB</div>
                <div><div class="font-bold text-sm">Party Hisab Book</div><div class="text-[11px]" style="color: var(--text-muted);">Zero-CORS Sync Edition</div></div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select id="partySel" class="app-input rounded-xl px-3 py-1.5 text-xs font-semibold">
                  ${state.parties.map(p => `<option value="${esc(p.id)}" ${p.id === party.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
                </select>
                <button id="btnNewParty" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white">+ Party</button>
                <button id="btnOpenSync" class="px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border ${isOk ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border-rose-500/30'}">
                  <span class="w-2 h-2 rounded-full ${isOk ? 'bg-emerald-400' : 'bg-rose-400'}"></span>${esc(syncStatus)}
                </button>
                <button id="btnTheme" class="app-subtle px-2.5 py-1.5 rounded-xl text-xs font-semibold">${isDark ? '☀️ Day' : '🌙 Night'}</button>
              </div>
            </div>
          </header>

          <main class="max-w-5xl mx-auto px-4 pt-5 space-y-5">
            <section class="app-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="text-lg font-extrabold">${esc(party.name)}</h1>
                <p class="text-xs" style="color: var(--text-muted);">${esc(party.city || '')} • ${esc(party.phone || '')}</p>
              </div>
              <div class="flex gap-2 no-print">
                <button onclick="window.print()" class="app-subtle px-3 py-2 rounded-xl text-xs font-semibold">🖨️ Print</button>
                <button id="btnLock" class="px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/15 text-amber-500 border border-amber-500/30">🔒 Lock O/S</button>
              </div>
            </section>

            <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="app-card rounded-2xl p-4"><div class="text-[11px] font-semibold uppercase" style="color:var(--text-muted)">Received</div><div class="text-lg font-extrabold text-emerald-500 tabular-nums mt-1">${formatINR(m.rec)}</div></div>
              <div class="app-card rounded-2xl p-4"><div class="text-[11px] font-semibold uppercase" style="color:var(--text-muted)">Returned</div><div class="text-lg font-extrabold text-sky-500 tabular-nums mt-1">${formatINR(m.ret)}</div></div>
              <div class="app-card rounded-2xl p-4"><div class="text-[11px] font-semibold uppercase" style="color:var(--text-muted)">Main O/S</div><div class="text-lg font-extrabold tabular-nums mt-1">${formatINR(m.mainOS)}</div></div>
              <div class="app-card rounded-2xl p-4 border-indigo-500/40"><div class="text-[11px] font-semibold uppercase text-indigo-400">Net O/S</div><div class="text-lg font-extrabold text-indigo-500 tabular-nums mt-1">${formatINR(m.netOS)}</div></div>
            </section>

            <div class="flex gap-2 no-print">
              ${['ledger', 'upi', 'batches'].map((t, i) => `<button data-tab="${t}" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold ${state.activeTab === t ? 'bg-indigo-600 text-white' : 'app-card'}">${['1. Main Ledger', '2. Proxy UPI', '3. Batches & Locks'][i]}</button>`).join('')}
            </div>

            ${state.activeTab === 'ledger' ? `
              <section class="app-card rounded-2xl p-4 space-y-4">
                <form id="formLedger" class="grid grid-cols-1 sm:grid-cols-6 gap-2 no-print">
                  <input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}" class="app-input rounded-xl px-3 py-2 text-xs" />
                  <select name="type" class="app-input rounded-xl px-3 py-2 text-xs font-semibold"><option value="RECEIVED">RECEIVED (+)</option><option value="RETURNED">RETURNED (-)</option></select>
                  <input type="number" name="amount" required min="1" step="any" placeholder="Amount ₹" class="app-input rounded-xl px-3 py-2 text-xs" />
                  <select name="mode" class="app-input rounded-xl px-3 py-2 text-xs"><option>RTGS</option><option>NEFT</option><option>IMPS</option><option>CASH</option></select>
                  <input type="text" name="ref" placeholder="Ref / UTR" class="app-input rounded-xl px-3 py-2 text-xs" />
                  <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl px-4 py-2 text-xs">+ Add</button>
                  <input type="text" name="notes" placeholder="Notes (optional)" class="app-input rounded-xl px-3 py-2 text-xs sm:col-span-6" />
                </form>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead><tr class="border-b" style="border-color:var(--border-card);color:var(--text-muted)"><th class="py-2">Date</th><th>Type</th><th>Mode/Ref</th><th>Notes</th><th class="text-right">Amount</th><th class="text-right no-print">Del</th></tr></thead>
                    <tbody>
                      ${m.ledger.map(r => `
                        <tr class="border-b" style="border-color:var(--border-subtle)">
                          <td class="py-2">${esc(r.date)}</td>
                          <td><span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.type==='RECEIVED'?'bg-emerald-500/15 text-emerald-500':'bg-sky-500/15 text-sky-500'}">${esc(r.type)}</span></td>
                          <td>${esc(r.mode)} ${r.ref?'• '+esc(r.ref):''}</td>
                          <td>${esc(r.notes)}</td>
                          <td class="text-right font-bold tabular-nums ${r.type==='RECEIVED'?'text-emerald-500':'text-sky-500'}">${r.type==='RECEIVED'?'+':'-'}${formatINR(r.amount)}</td>
                          <td class="text-right no-print"><button data-del-led="${esc(r.id)}" class="text-rose-400">✕</button></td>
                        </tr>`).join('') || '<tr><td colspan="6" class="py-4 text-center" style="color:var(--text-muted)">No entries</td></tr>'}
                    </tbody>
                  </table>
                </div>
              </section>
            ` : ''}

            ${state.activeTab === 'upi' ? `
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <section class="app-card rounded-2xl p-4 space-y-3">
                  <div class="flex justify-between"><h2 class="text-sm font-bold">UPI Instructions</h2><span class="text-xs font-bold text-indigo-400">${formatINR(m.openTgt)}</span></div>
                  <form id="formTarget" class="grid grid-cols-2 gap-2 no-print">
                    <input name="payeeName" required placeholder="Payee Name" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <input name="upiId" required placeholder="UPI ID" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <input type="number" name="targetAmount" required placeholder="Target ₹" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <input name="notes" placeholder="Note" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <button type="submit" class="col-span-2 bg-indigo-600 text-white font-bold rounded-xl py-2 text-xs">+ Add Instruction</button>
                  </form>
                  ${m.targets.filter(x=>x.status!=='FINALIZED').map(t => `<div class="app-subtle rounded-xl p-2.5 flex justify-between text-xs"><div><b>${esc(t.payeeName)}</b> (${esc(t.upiId)})</div><div class="font-bold">${formatINR(t.targetAmount)} <button data-del-tgt="${esc(t.id)}" class="text-rose-400 ml-2">✕</button></div></div>`).join('')}
                </section>
                <section class="app-card rounded-2xl p-4 space-y-3">
                  <div class="flex justify-between"><h2 class="text-sm font-bold">UPI Payouts Sent</h2><button id="btnFin" class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-600 text-white no-print">Finalize (${formatINR(m.openPaid)})</button></div>
                  <form id="formPayout" class="grid grid-cols-2 gap-2 no-print">
                    <input name="recipientName" required placeholder="Recipient Name" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <input type="number" name="amount" required placeholder="Amount ₹" class="app-input rounded-xl px-3 py-2 text-xs" />
                    <input name="utr" required placeholder="UTR No." class="app-input rounded-xl px-3 py-2 text-xs" />
                    <select name="appMode" class="app-input rounded-xl px-3 py-2 text-xs"><option>GPay</option><option>PhonePe</option><option>Paytm</option></select>
                    <button type="submit" class="col-span-2 bg-sky-600 text-white font-bold rounded-xl py-2 text-xs">+ Record Payout</button>
                  </form>
                  ${m.payouts.filter(x=>x.status!=='FINALIZED').map(p => `<div class="app-subtle rounded-xl p-2.5 flex justify-between text-xs"><div><b>${esc(p.recipientName)}</b> • UTR: ${esc(p.utr)}</div><div class="font-bold text-sky-500">${formatINR(p.amount)} <button data-del-pay="${esc(p.id)}" class="text-rose-400 ml-2">✕</button></div></div>`).join('')}
                </section>
              </div>
            ` : ''}

            ${state.activeTab === 'batches' ? `
              <section class="app-card rounded-2xl p-4 space-y-3 text-xs">
                <h2 class="text-sm font-bold">Finalized Batches & O/S Locks</h2>
                ${state.finalizedBatches.filter(b=>b.partyId===party.id).map(b => `<div class="app-subtle p-3 rounded-xl flex justify-between"><div><b>${esc(b.id)}</b> (${esc(b.date)})</div><div class="font-bold text-emerald-500">${formatINR(b.totalPaid)}</div></div>`).join('') || '<div style="color:var(--text-muted)">No batches</div>'}
                ${state.settlements.filter(s=>s.partyId===party.id).map(s => `<div class="app-subtle p-3 rounded-xl flex justify-between"><div>🔒 Locked on ${esc(s.date)} — ${esc(s.notes)}</div><div class="font-bold">${formatINR(s.closingOS)}</div></div>`).join('')}
              </section>
            ` : ''}
          </main>

          ${isSyncModalOpen ? `
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 no-print">
              <div class="app-card rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                <div class="bg-emerald-600 p-4 text-white flex justify-between items-center">
                  <div><h3 class="font-extrabold text-sm">Google Sheets Sync (Zero-CORS)</h3><p class="text-[11px] text-emerald-100">Works on GitHub Pages, Local Files & Mobile</p></div>
                  <button id="btnCloseSync" class="font-bold text-lg">✕</button>
                </div>
                <div class="p-4 space-y-3">
                  <div class="app-subtle rounded-xl p-3 flex justify-between text-xs">
                    <span class="font-bold ${isOk ? 'text-emerald-500' : 'text-rose-400'}">${esc(syncStatus)}</span>
                    <span style="color:var(--text-muted)">${esc(lastSyncTime)}</span>
                  </div>
                  <input id="inputUrl" type="url" value="${esc(syncUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <div class="grid grid-cols-2 gap-2">
                    <button id="btnTest" ${isSyncing?'disabled':''} class="bg-emerald-600 text-white font-bold rounded-xl py-2.5 text-xs">${isSyncing?'Working...':'Test & Connect'}</button>
                    <button id="btnPush" ${isSyncing?'disabled':''} class="bg-sky-600 text-white font-bold rounded-xl py-2.5 text-xs">Push Local → Sheet</button>
                    <button id="btnPull" ${isSyncing?'disabled':''} class="bg-indigo-600 text-white font-bold rounded-xl py-2.5 text-xs">Pull Latest ← Sheet</button>
                    <button id="btnDisc" class="bg-rose-500/15 text-rose-400 font-bold rounded-xl py-2.5 text-xs">Disconnect</button>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}

          ${isAddPartyModalOpen ? `
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 no-print">
              <div class="app-card rounded-2xl max-w-sm w-full p-4 space-y-3">
                <div class="flex justify-between"><h3 class="font-bold text-sm">New Party</h3><button id="btnCloseParty">✕</button></div>
                <form id="formParty" class="space-y-2">
                  <input name="name" required placeholder="Party Name *" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <input name="city" placeholder="City" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <input name="phone" placeholder="Phone" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <button type="submit" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-2 text-xs">Save Party</button>
                </form>
              </div>
            </div>
          ` : ''}
        `;

        // Event bindings
        document.getElementById('partySel').onchange = e => { state.activePartyId = e.target.value; saveLocal(); render(); };
        document.getElementById('btnTheme').onclick = () => { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem(THEME_KEY, d?'dark':'light'); render(); };
        document.getElementById('btnOpenSync').onclick = () => { isSyncModalOpen = true; render(); };
        if (document.getElementById('btnCloseSync')) document.getElementById('btnCloseSync').onclick = () => { isSyncModalOpen = false; render(); };
        if (document.getElementById('inputUrl')) document.getElementById('inputUrl').oninput = e => { syncUrl = e.target.value; };
        if (document.getElementById('btnTest')) document.getElementById('btnTest').onclick = testConnection;
        if (document.getElementById('btnPush')) document.getElementById('btnPush').onclick = pushToSheet;
        if (document.getElementById('btnPull')) document.getElementById('btnPull').onclick = pullFromSheet;
        if (document.getElementById('btnDisc')) document.getElementById('btnDisc').onclick = () => { localStorage.removeItem(SYNC_URL_KEY); syncUrl=''; syncStatus='Disconnected'; render(); };
        document.getElementById('btnNewParty').onclick = () => { isAddPartyModalOpen = true; render(); };
        if (document.getElementById('btnCloseParty')) document.getElementById('btnCloseParty').onclick = () => { isAddPartyModalOpen = false; render(); };
        if (document.getElementById('formParty')) document.getElementById('formParty').onsubmit = e => {
          e.preventDefault(); const fd = new FormData(e.target); const id = 'party_' + Date.now();
          state.parties.push({ id, name: fd.get('name'), city: fd.get('city'), phone: fd.get('phone') });
          state.activePartyId = id; isAddPartyModalOpen = false; autoSync(); render();
        };
        document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { state.activeTab = b.dataset.tab; render(); });
        if (document.getElementById('formLedger')) document.getElementById('formLedger').onsubmit = e => {
          e.preventDefault(); const fd = new FormData(e.target);
          state.mainLedger.unshift({ id: 'led_'+Date.now(), partyId: party.id, date: fd.get('date'), type: fd.get('type'), amount: Number(fd.get('amount')), mode: fd.get('mode'), ref: fd.get('ref'), notes: fd.get('notes') });
          autoSync(); render();
        };
        document.querySelectorAll('[data-del-led]').forEach(b => b.onclick = () => { state.mainLedger = state.mainLedger.filter(x=>x.id!==b.dataset.delLed); autoSync(); render(); });
        if (document.getElementById('formTarget')) document.getElementById('formTarget').onsubmit = e => {
          e.preventDefault(); const fd = new FormData(e.target);
          state.upiTargets.unshift({ id: 'tgt_'+Date.now(), partyId: party.id, date: new Date().toISOString().slice(0,10), payeeName: fd.get('payeeName'), upiId: fd.get('upiId'), targetAmount: Number(fd.get('targetAmount')), notes: fd.get('notes'), status: 'OPEN' });
          autoSync(); render();
        };
        document.querySelectorAll('[data-del-tgt]').forEach(b => b.onclick = () => { state.upiTargets = state.upiTargets.filter(x=>x.id!==b.dataset.delTgt); autoSync(); render(); });
        if (document.getElementById('formPayout')) document.getElementById('formPayout').onsubmit = e => {
          e.preventDefault(); const fd = new FormData(e.target);
          state.upiPayouts.unshift({ id: 'pay_'+Date.now(), partyId: party.id, date: new Date().toISOString().slice(0,10), recipientName: fd.get('recipientName'), amount: Number(fd.get('amount')), utr: fd.get('utr'), appMode: fd.get('appMode'), status: 'OPEN' });
          autoSync(); render();
        };
        document.querySelectorAll('[data-del-pay]').forEach(b => b.onclick = () => { state.upiPayouts = state.upiPayouts.filter(x=>x.id!==b.dataset.delPay); autoSync(); render(); });
        if (document.getElementById('btnFin')) document.getElementById('btnFin').onclick = () => {
          const open = state.upiPayouts.filter(x => x.partyId === party.id && x.status !== 'FINALIZED');
          if (!open.length) return alert('No open payouts');
          const tot = open.reduce((s, x) => s + Number(x.amount), 0);
          const bid = 'BATCH_' + Date.now();
          open.forEach(x => { x.status = 'FINALIZED'; x.batchId = bid; });
          state.upiTargets.filter(x => x.partyId === party.id && x.status !== 'FINALIZED').forEach(x => { x.status = 'FINALIZED'; x.batchId = bid; });
          state.mainLedger.unshift({ id: 'led_'+Date.now(), partyId: party.id, date: new Date().toISOString().slice(0,10), type: 'RETURNED', amount: tot, mode: 'UPI-BATCH', ref: bid, notes: 'Finalized UPI Batch' });
          state.finalizedBatches.unshift({ id: bid, partyId: party.id, date: new Date().toISOString().slice(0,10), totalPaid: tot });
          autoSync(); render();
        };
        document.getElementById('btnLock').onclick = () => {
          const note = prompt('Lock note:', 'Confirmed'); if (note === null) return;
          state.settlements.unshift({ id: 'set_'+Date.now(), partyId: party.id, date: new Date().toISOString().slice(0,10), closingOS: m.netOS, notes: note });
          autoSync(); render();
        };
      }
      render();
    })();
  </script>
</body>
</html>
