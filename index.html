<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Hisab Book</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='50%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 16h22a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H18V16z' fill='%23ffffff' fill-opacity='0.95'/%3E%3Cpath d='M24 24h16M24 31h12M24 38h14' stroke='%234f46e5' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='46' r='11' fill='%23f59e0b' stroke='%23ffffff' stroke-width='2.5'/%3E%3Ctext x='46' y='50' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='12' fill='%23ffffff'%3E%E2%82%B9%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f0f4ff;
      --bg-card: #ffffff;
      --bg-subtle: #f5f8ff;
      --bg-header: rgba(255, 255, 255, 0.92);
      --bg-input: #ffffff;
      --border-card: #e1e8f8;
      --border-subtle: #edf2fc;
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      --accent-indigo: #4f46e5;
    }

    html.dark {
      --bg-app: #080d1a;
      --bg-card: #111827;
      --bg-subtle: #192236;
      --bg-header: rgba(11, 17, 32, 0.92);
      --bg-input: #0b1120;
      --border-card: #1f2b42;
      --border-subtle: #182236;
      --border-input: #2c3b59;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --shadow-card: 0 10px 28px -4px rgba(0, 0, 0, 0.45);
      --accent-indigo: #6366f1;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
    }

    .app-subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
    }

    .app-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--text-primary);
    }

    .app-input:focus {
      outline: none;
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.16);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .app-card { box-shadow: none !important; border: 1px solid #ddd !important; }
      .print-full { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen pb-20">
  <div id="app"></div>
  <iframe name="gs_hidden_iframe" id="gs_hidden_iframe" style="display:none;"></iframe>

  <script>
    (function () {
      const STORAGE_KEY = 'party_hisab_book_v3';
      const SYNC_URL_KEY = 'party_hisab_gs_url';
      const THEME_KEY = 'party_hisab_theme';

      const defaultState = {
        activePartyId: 'party_1',
        activeTab: 'ledger',
        statementMode: false,
        parties: [
          {
            id: 'party_1',
            name: 'Party A - Shri Balaji Traders',
            city: 'Ranchi',
            phone: '98351 44210',
            updatedAt: new Date().toISOString()
          }
        ],
        mainLedger: [
          {
            id: 'led_101',
            partyId: 'party_1',
            date: '2026-11-18',
            type: 'RECEIVED',
            amount: 2500000,
            mode: 'RTGS',
            ref: 'HDFCR520261118001',
            notes: 'Advance inward transfer',
            batchId: '',
            proofUrl: '',
            updatedAt: new Date().toISOString()
          },
          {
            id: 'led_102',
            partyId: 'party_1',
            date: '2026-11-20',
            type: 'RETURNED',
            amount: 150000,
            mode: 'NEFT',
            ref: 'NEFT882910',
            notes: 'Direct bank return',
            batchId: '',
            proofUrl: '',
            updatedAt: new Date().toISOString()
          }
        ],
        upiTargets: [
          {
            id: 'tgt_201',
            partyId: 'party_1',
            date: '2026-11-21',
            payeeName: 'Verma Transport',
            upiId: 'vermatransport@okaxis',
            targetAmount: 85000,
            notes: 'Freight settlement',
            status: 'OPEN',
            batchId: '',
            updatedAt: new Date().toISOString()
          }
        ],
        upiPayouts: [
          {
            id: 'pay_301',
            partyId: 'party_1',
            date: '2026-11-21',
            recipientName: 'Verma Transport',
            upiId: 'vermatransport@okaxis',
            amount: 50000,
            utr: '632519847120',
            appMode: 'GPay',
            allocatedTargetId: 'tgt_201',
            notes: 'Part 1 UPI sent',
            status: 'OPEN',
            batchId: '',
            proofUrl: '',
            updatedAt: new Date().toISOString()
          }
        ],
        finalizedBatches: [],
        settlements: []
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('party_hisab_book_v4');
          if (!raw) return JSON.parse(JSON.stringify(defaultState));
          const parsed = JSON.parse(raw);
          return Object.assign({}, JSON.parse(JSON.stringify(defaultState)), parsed);
        } catch (e) {
          return JSON.parse(JSON.stringify(defaultState));
        }
      }

      let state = loadState();
      let syncUrl = localStorage.getItem(SYNC_URL_KEY) || '';
      let syncStatus = syncUrl ? 'Saved URL (Not tested)' : 'Local Mode';
      let syncErrorDetail = '';
      let lastSyncTime = 'Not synced yet';
      let isSyncModalOpen = false;
      let isAddPartyModalOpen = false;
      let isSyncing = false;
      let previewImageUrl = '';
      let ledgerFilter = '';
      let upiFilter = '';

      if (localStorage.getItem(THEME_KEY) === 'dark') {
        document.documentElement.classList.add('dark');
      }

      function saveLocal() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn('LocalStorage save failed:', e);
        }
      }

      function formatINR(num) {
        const val = Number(num) || 0;
        return '₹' + val.toLocaleString('en-IN');
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function getActiveParty() {
        return state.parties.find(p => p.id === state.activePartyId) || state.parties[0] || {
          id: 'party_1',
          name: 'Default Party',
          city: '',
          phone: ''
        };
      }

      function computePartyMetrics(partyId) {
        const ledger = state.mainLedger.filter(x => x.partyId === partyId);
        const targets = state.upiTargets.filter(x => x.partyId === partyId);
        const payouts = state.upiPayouts.filter(x => x.partyId === partyId);

        const totalReceived = ledger
          .filter(x => x.type === 'RECEIVED')
          .reduce((s, x) => s + (Number(x.amount) || 0), 0);

        const mainReturned = ledger
          .filter(x => x.type === 'RETURNED')
          .reduce((s, x) => s + (Number(x.amount) || 0), 0);

        const openUpiPaid = payouts
          .filter(x => x.status !== 'FINALIZED')
          .reduce((s, x) => s + (Number(x.amount) || 0), 0);

        const openUpiTarget = targets
          .filter(x => x.status !== 'FINALIZED')
          .reduce((s, x) => s + (Number(x.targetAmount) || 0), 0);

        const mainLedgerOS = totalReceived - mainReturned;
        const totalNetOS = mainLedgerOS - openUpiPaid;

        return {
          totalReceived,
          mainReturned,
          mainLedgerOS,
          openUpiPaid,
          openUpiTarget,
          totalNetOS,
          ledger,
          targets,
          payouts
        };
      }

      function readFileAsCompressedDataUrl(file) {
        return new Promise((resolve) => {
          if (!file) return resolve('');
          const reader = new FileReader();
          reader.onload = function (ev) {
            const img = new Image();
            img.onload = function () {
              const canvas = document.createElement('canvas');
              const maxW = 1024;
              const scale = img.width > maxW ? (maxW / img.width) : 1;
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = function () { resolve(ev.target.result || ''); };
            img.src = ev.target.result;
          };
          reader.onerror = function () { resolve(''); };
          reader.readAsDataURL(file);
        });
      }

      // ZERO-CORS JSONP GET ENGINE
      function jsonpGet(action) {
        return new Promise((resolve, reject) => {
          const url = String(syncUrl || '').trim();
          if (!url) return reject(new Error('Please paste your https://script.google.com/macros/s/.../exec URL'));
          const cbName = 'gs_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          const script = document.createElement('script');
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error('Connection timed out. Verify Web App URL and "Who has access: Anyone".'));
          }, 14000);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = function (data) {
            cleanup();
            resolve(data);
          };

          script.onerror = function () {
            cleanup();
            reject(new Error('Failed to load Google Apps Script. Check URL and set access to "Anyone".'));
          };

          const sep = url.indexOf('?') === -1 ? '?' : '&';
          script.src = url + sep + 'action=' + encodeURIComponent(action) + '&callback=' + cbName + '&_t=' + Date.now();
          document.body.appendChild(script);
        });
      }

      // ZERO-CORS HIDDEN FORM POST ENGINE
      function formPost(payloadObj) {
        return new Promise((resolve, reject) => {
          const url = String(syncUrl || '').trim();
          if (!url) return reject(new Error('Please paste your https://script.google.com/macros/s/.../exec URL'));

          const form = document.createElement('form');
          form.method = 'POST';
          form.action = url;
          form.target = 'gs_hidden_iframe';
          form.style.display = 'none';

          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'payload';
          input.value = JSON.stringify(payloadObj);

          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();

          setTimeout(() => {
            if (form.parentNode) form.parentNode.removeChild(form);
            resolve({ ok: true });
          }, 2000);
        });
      }

      async function testConnection() {
        const url = String(syncUrl || '').trim();
        if (!url) {
          syncStatus = 'Enter Web App URL first';
          syncErrorDetail = 'Please paste your https://script.google.com/macros/s/.../exec URL';
          render();
          return;
        }
        isSyncing = true;
        syncStatus = 'Connecting...';
        syncErrorDetail = '';
        render();

        try {
          const json = await jsonpGet('ping');
          if (json && json.ok === true) {
            localStorage.setItem(SYNC_URL_KEY, url);
            syncUrl = url;
            syncStatus = 'Connected';
            syncErrorDetail = '';
            lastSyncTime = new Date().toLocaleTimeString();
          } else {
            syncStatus = 'Script returned error';
            syncErrorDetail = (json && json.error) ? json.error : 'Unknown script response';
          }
        } catch (err) {
          syncStatus = 'Connection error';
          syncErrorDetail = err && err.message ? err.message : String(err);
        } finally {
          isSyncing = false;
          render();
        }
      }

      async function pushToSheet() {
        const url = String(syncUrl || '').trim();
        if (!url) {
          syncStatus = 'Enter Web App URL first';
          render();
          return;
        }
        isSyncing = true;
        syncStatus = 'Pushing to Sheet...';
        syncErrorDetail = '';
        render();

        try {
          await formPost({
            action: 'pushAll',
            data: {
              parties: state.parties,
              mainLedger: state.mainLedger,
              upiTargets: state.upiTargets,
              upiPayouts: state.upiPayouts,
              finalizedBatches: state.finalizedBatches,
              settlements: state.settlements
            }
          });
          localStorage.setItem(SYNC_URL_KEY, url);
          syncStatus = 'Connected & Synced';
          syncErrorDetail = '';
          lastSyncTime = new Date().toLocaleTimeString();
        } catch (err) {
          syncStatus = 'Push error';
          syncErrorDetail = err && err.message ? err.message : String(err);
        } finally {
          isSyncing = false;
          render();
        }
      }

      async function pullFromSheet() {
        const url = String(syncUrl || '').trim();
        if (!url) {
          syncStatus = 'Enter Web App URL first';
          render();
          return;
        }
        isSyncing = true;
        syncStatus = 'Pulling from Sheet...';
        syncErrorDetail = '';
        render();

        try {
          const json = await jsonpGet('pull');
          if (json && json.ok === true && json.data) {
            if (Array.isArray(json.data.parties) && json.data.parties.length > 0) {
              state.parties = json.data.parties;
              if (!state.parties.some(p => p.id === state.activePartyId)) {
                state.activePartyId = state.parties[0].id;
              }
            }
            state.mainLedger = json.data.mainLedger || [];
            state.upiTargets = json.data.upiTargets || [];
            state.upiPayouts = json.data.upiPayouts || [];
            state.finalizedBatches = json.data.finalizedBatches || [];
            state.settlements = json.data.settlements || [];
            saveLocal();
            syncStatus = 'Pulled Latest Sheet';
            syncErrorDetail = '';
            lastSyncTime = new Date().toLocaleTimeString();
          } else {
            syncStatus = 'Script returned error';
            syncErrorDetail = (json && json.error) ? json.error : 'Pull failed';
          }
        } catch (err) {
          syncStatus = 'Pull error';
          syncErrorDetail = err && err.message ? err.message : String(err);
        } finally {
          isSyncing = false;
          render();
        }
      }

      function autoSyncIfConnected() {
        saveLocal();
        if (syncUrl && (syncStatus.indexOf('Connected') !== -1 || syncStatus.indexOf('Pulled') !== -1)) {
          pushToSheet();
        }
      }

      function finalizeOpenUpiBatch(partyId) {
        const m = computePartyMetrics(partyId);
        const openTargets = m.targets.filter(x => x.status !== 'FINALIZED');
        const openPayouts = m.payouts.filter(x => x.status !== 'FINALIZED');
        if (openPayouts.length === 0) {
          alert('No open UPI payouts to finalize.');
          return;
        }
        const batchId = 'BATCH_' + Date.now();
        const today = new Date().toISOString().slice(0, 10);
        const totalPaid = openPayouts.reduce((s, x) => s + (Number(x.amount) || 0), 0);
        const totalTarget = openTargets.reduce((s, x) => s + (Number(x.targetAmount) || 0), 0);

        state.upiTargets.forEach(t => {
          if (t.partyId === partyId && t.status !== 'FINALIZED') {
            t.status = 'FINALIZED';
            t.batchId = batchId;
          }
        });
        state.upiPayouts.forEach(p => {
          if (p.partyId === partyId && p.status !== 'FINALIZED') {
            p.status = 'FINALIZED';
            p.batchId = batchId;
          }
        });

        state.mainLedger.unshift({
          id: 'led_' + Date.now(),
          partyId: partyId,
          date: today,
          type: 'RETURNED',
          amount: totalPaid,
          mode: 'UPI-BATCH',
          ref: batchId,
          notes: 'Finalized ' + openPayouts.length + ' UPI payouts',
          batchId: batchId,
          proofUrl: '',
          updatedAt: new Date().toISOString()
        });

        state.finalizedBatches.unshift({
          id: batchId,
          partyId: partyId,
          date: today,
          message: 'Finalized ' + openPayouts.length + ' payouts',
          totalPaid: totalPaid,
          totalTarget: totalTarget,
          variance: totalTarget - totalPaid,
          payoutCount: openPayouts.length,
          updatedAt: new Date().toISOString()
        });

        autoSyncIfConnected();
        render();
      }

      function lockClosingOS(partyId) {
        const m = computePartyMetrics(partyId);
        const today = new Date().toISOString().slice(0, 10);
        const note = prompt('Optional settlement / confirmation note:', 'Balance confirmed with party');
        if (note === null) return;
        state.settlements.unshift({
          id: 'set_' + Date.now(),
          partyId: partyId,
          date: today,
          closingOS: m.totalNetOS,
          notes: note,
          updatedAt: new Date().toISOString()
        });
        autoSyncIfConnected();
        render();
      }

      function shareWhatsAppSummary(party, m) {
        const lines = [
          '*PARTY HISAB STATEMENT*',
          '*Party:* ' + party.name,
          '*Date:* ' + new Date().toLocaleDateString('en-IN'),
          '------------------------',
          'Total Received: ' + formatINR(m.totalReceived),
          'Main Returned: ' + formatINR(m.mainReturned),
          'Main Ledger O/S: ' + formatINR(m.mainLedgerOS),
          'Open UPI Paid: ' + formatINR(m.openUpiPaid),
          '*NET CLOSING O/S: ' + formatINR(m.totalNetOS) + '*',
          '------------------------',
          'Generated via Party Hisab Book'
        ];
        window.open('https://wa.me/?text=' + encodeURIComponent(lines.join('\n')), '_blank');
      }

      function exportJSONBackup() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Party_Hisab_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
      }

      function render() {
        const party = getActiveParty();
        const m = computePartyMetrics(party.id);
        const isDark = document.documentElement.classList.contains('dark');
        const isConnected = syncStatus.indexOf('Connected') !== -1 || syncStatus.indexOf('Pulled') !== -1;

        const filteredLedger = m.ledger.filter(r => {
          if (!ledgerFilter) return true;
          const q = ledgerFilter.toLowerCase();
          return (r.ref || '').toLowerCase().includes(q) ||
                 (r.notes || '').toLowerCase().includes(q) ||
                 (r.mode || '').toLowerCase().includes(q) ||
                 String(r.amount).includes(q);
        });

        const filteredPayouts = m.payouts.filter(x => x.status !== 'FINALIZED').filter(p => {
          if (!upiFilter) return true;
          const q = upiFilter.toLowerCase();
          return (p.recipientName || '').toLowerCase().includes(q) ||
                 (p.utr || '').toLowerCase().includes(q) ||
                 (p.appMode || '').toLowerCase().includes(q);
        });

        const root = document.getElementById('app');
        root.innerHTML = `
          <!-- Top Bar -->
          <header class="sticky top-0 z-30 border-b backdrop-blur-md no-print" style="background: var(--bg-header); border-color: var(--border-card);">
            <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <!-- Colourful Gradient Ledger & Rupee Emblem Logo -->
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-600 via-purple-600 to-emerald-500 p-0.5 shadow-md shrink-0">
                  <div class="w-full h-full rounded-[14px] bg-slate-950/15 backdrop-blur-xs flex items-center justify-center relative">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                      <path d="M9 7h6M9 11h4"></path>
                    </svg>
                    <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-amber-400 text-slate-950 font-black text-[10px] flex items-center justify-center shadow">₹</span>
                  </div>
                </div>
                <div>
                  <div class="font-extrabold text-sm leading-tight bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500 bg-clip-text text-transparent">Party Hisab Book</div>
                  <div class="text-[11px]" style="color: var(--text-muted);">Multi-Party Ledger & Proxy UPI</div>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <select id="partySelector" class="app-input rounded-xl px-3 py-1.5 text-xs font-semibold">
                  ${state.parties.map(p => `<option value="${esc(p.id)}" ${p.id === party.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
                </select>
                <button id="btnNewParty" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-indigo-600 to-purple-600 text-white hover:opacity-95 shadow-xs">+ Party</button>
                <button id="btnOpenSync" class="px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border ${isConnected ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border-rose-500/30'}">
                  <span class="w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
                  ${esc(syncStatus)}
                </button>
                <button id="btnToggleTheme" class="app-subtle px-2.5 py-1.5 rounded-xl text-xs font-semibold">
                  ${isDark ? '☀️ Day' : '🌙 Night'}
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-5xl mx-auto px-4 pt-5 space-y-5">
            <!-- Party Header Card -->
            <section class="app-card rounded-2xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
              <div>

                    </button>
                    <button id="btnPullSheet" ${isSyncing ? 'disabled' : ''} class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-2.5 text-xs">
                      Pull Latest ← Sheet
                    </button>
                    <button id="btnDisconnect" class="bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 font-bold rounded-xl py-2.5 text-xs">
                      Disconnect
                    </button>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Add Party Modal -->
          ${isAddPartyModalOpen ? `
            <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
              <div class="app-card rounded-2xl max-w-sm w-full p-5 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-extrabold text-sm">Add New Party Account</h3>
                  <button id="btnClosePartyModal" class="text-sm font-bold">✕</button>
                </div>
                <form id="formNewParty" class="space-y-2.5">
                  <input type="text" name="name" required placeholder="Party / Firm Name *" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <input type="text" name="city" placeholder="City" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <input type="text" name="phone" placeholder="Phone Number" class="app-input w-full rounded-xl px-3 py-2 text-xs" />
                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-2.5 text-xs">Create Party Ledger</button>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- Proof Image Viewer Modal -->
          ${previewImageUrl ? `
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 no-print">
              <div class="app-card rounded-2xl max-w-lg w-full p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-sm">Payment Proof / Screenshot</h3>
                  <button id="btnCloseProof" class="text-sm font-bold">✕</button>
                </div>
                ${previewImageUrl.indexOf('data:image/') === 0
                  ? `<img src="${esc(previewImageUrl)}" class="w-full max-h-[70vh] object-contain rounded-xl" />`
                  : `<div class="p-4 text-center space-y-2"><p class="text-xs">Stored securely in Google Drive:</p><a href="${esc(previewImageUrl)}" target="_blank" class="inline-block px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Open in Google Drive</a></div>`
                }
              </div>
            </div>
          ` : ''}
        `;

        bindEvents();
      }

      function bindEvents() {
        const partySel = document.getElementById('partySelector');
        if (partySel) {
          partySel.onchange = e => {
            state.activePartyId = e.target.value;
            saveLocal();
            render();
          };
        }

        const btnTheme = document.getElementById('btnToggleTheme');
        if (btnTheme) {
          btnTheme.onclick = () => {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
            render();
          };
        }

        const btnWhatsApp = document.getElementById('btnWhatsApp');
        if (btnWhatsApp) {
          btnWhatsApp.onclick = () => {
            const p = getActiveParty();
            shareWhatsAppSummary(p, computePartyMetrics(p.id));
          };
        }

        const btnStmt = document.getElementById('btnStatementToggle');
        if (btnStmt) {
          btnStmt.onclick = () => {
            state.statementMode = !state.statementMode;
            render();
          };
        }

        const btnPrint = document.getElementById('btnPrint');
        if (btnPrint) btnPrint.onclick = () => window.print();

        const btnLockOS = document.getElementById('btnLockOS');
        if (btnLockOS) btnLockOS.onclick = () => lockClosingOS(getActiveParty().id);

        const btnBackup = document.getElementById('btnBackupJson');
        if (btnBackup) btnBackup.onclick = exportJSONBackup;

        const btnOpenSync = document.getElementById('btnOpenSync');
        if (btnOpenSync) btnOpenSync.onclick = () => { isSyncModalOpen = true; render(); };

        const btnCloseSync = document.getElementById('btnCloseSync');
        if (btnCloseSync) btnCloseSync.onclick = () => { isSyncModalOpen = false; render(); };

        const inputSyncUrl = document.getElementById('inputSyncUrl');
        if (inputSyncUrl) {
          inputSyncUrl.oninput = e => { syncUrl = e.target.value; };
        }

        const btnTest = document.getElementById('btnTestConnect');
        if (btnTest) btnTest.onclick = testConnection;

        const btnPush = document.getElementById('btnPushSheet');
        if (btnPush) btnPush.onclick = pushToSheet;

        const btnPull = document.getElementById('btnPullSheet');
        if (btnPull) btnPull.onclick = pullFromSheet;

        const btnDisc = document.getElementById('btnDisconnect');
        if (btnDisc) {
          btnDisc.onclick = () => {
            localStorage.removeItem(SYNC_URL_KEY);
            syncUrl = '';
            syncStatus = 'Disconnected';
            syncErrorDetail = '';
            render();
          };
        }

        const btnNewParty = document.getElementById('btnNewParty');
        if (btnNewParty) btnNewParty.onclick = () => { isAddPartyModalOpen = true; render(); };

        const btnCloseParty = document.getElementById('btnClosePartyModal');
        if (btnCloseParty) btnCloseParty.onclick = () => { isAddPartyModalOpen = false; render(); };

        const formNewParty = document.getElementById('formNewParty');
        if (formNewParty) {
          formNewParty.onsubmit = e => {
            e.preventDefault();
            const fd = new FormData(formNewParty);
            const id = 'party_' + Date.now();
            state.parties.push({
              id: id,
              name: String(fd.get('name') || '').trim(),
              city: String(fd.get('city') || '').trim(),
              phone: String(fd.get('phone') || '').trim(),
              updatedAt: new Date().toISOString()
            });
            state.activePartyId = id;
            isAddPartyModalOpen = false;
            autoSyncIfConnected();
            render();
          };
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = () => {
            state.activeTab = btn.getAttribute('data-tab');
            render();
          };
        });

        const inpSearchLedger = document.getElementById('inpSearchLedger');
        if (inpSearchLedger) {
          inpSearchLedger.oninput = e => {
            ledgerFilter = e.target.value;
            render();
            const el = document.getElementById('inpSearchLedger');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }

        const inpSearchUpi = document.getElementById('inpSearchUpi');
        if (inpSearchUpi) {
          inpSearchUpi.oninput = e => {
            upiFilter = e.target.value;
            render();
            const el = document.getElementById('inpSearchUpi');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }

        const formLedger = document.getElementById('formLedger');
        if (formLedger) {
          formLedger.onsubmit = async e => {
            e.preventDefault();
            const fd = new FormData(formLedger);
            const file = fd.get('proofFile');
            const proofData = await readFileAsCompressedDataUrl(file);
            state.mainLedger.unshift({
              id: 'led_' + Date.now(),
              partyId: getActiveParty().id,
              date: fd.get('date'),
              type: fd.get('type'),
              amount: Number(fd.get('amount')) || 0,
              mode: fd.get('mode'),
              ref: String(fd.get('ref') || '').trim(),
              notes: String(fd.get('notes') || '').trim(),
              batchId: '',
              proofUrl: proofData,
              updatedAt: new Date().toISOString()
            });
            autoSyncIfConnected();
            render();
          };
        }

        document.querySelectorAll('[data-del-ledger]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-del-ledger');
            state.mainLedger = state.mainLedger.filter(x => x.id !== id);
            autoSyncIfConnected();
            render();
          };
        });

        const formTarget = document.getElementById('formTarget');
        if (formTarget) {
          formTarget.onsubmit = e => {
            e.preventDefault();
            const fd = new FormData(formTarget);
            state.upiTargets.unshift({
              id: 'tgt_' + Date.now(),
              partyId: getActiveParty().id,
              date: new Date().toISOString().slice(0, 10),
              payeeName: String(fd.get('payeeName') || '').trim(),
              upiId: String(fd.get('upiId') || '').trim(),
              targetAmount: Number(fd.get('targetAmount')) || 0,
              notes: String(fd.get('notes') || '').trim(),
              status: 'OPEN',
              batchId: '',
              updatedAt: new Date().toISOString()
            });
            autoSyncIfConnected();
            render();
          };
        }

        document.querySelectorAll('[data-del-target]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-del-target');
            state.upiTargets = state.upiTargets.filter(x => x.id !== id);
            autoSyncIfConnected();
            render();
          };
        });

        const selAlloc = document.getElementById('selAllocTarget');
        const inpRec = document.getElementById('inpRecipient');
        if (selAlloc && inpRec) {
          selAlloc.onchange = () => {
            const opt = selAlloc.options[selAlloc.selectedIndex];
            if (opt && opt.dataset.payee && !inpRec.value) {
              inpRec.value = opt.dataset.payee;
            }
          };
        }

        const formPayout = document.getElementById('formPayout');
        if (formPayout) {
          formPayout.onsubmit = async e => {
            e.preventDefault();
            const fd = new FormData(formPayout);
            const targetId = String(fd.get('allocatedTargetId') || '');
            const linkedTarget = state.upiTargets.find(t => t.id === targetId);
            const file = fd.get('proofFile');
            const proofData = await readFileAsCompressedDataUrl(file);
            state.upiPayouts.unshift({
              id: 'pay_' + Date.now(),
              partyId: getActiveParty().id,
              date: new Date().toISOString().slice(0, 10),
              recipientName: String(fd.get('recipientName') || '').trim(),
              upiId: linkedTarget ? linkedTarget.upiId : '',
              amount: Number(fd.get('amount')) || 0,
              utr: String(fd.get('utr') || '').trim(),
              appMode: fd.get('appMode'),
              allocatedTargetId: targetId,
              notes: '',
              status: 'OPEN',
              batchId: '',
              proofUrl: proofData,
              updatedAt: new Date().toISOString()
            });
            autoSyncIfConnected();
            render();
          };
        }

        document.querySelectorAll('[data-del-payout]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.getAttribute('data-del-payout');
            state.upiPayouts = state.upiPayouts.filter(x => x.id !== id);
            autoSyncIfConnected();
            render();
          };
        });

        const btnFin = document.getElementById('btnFinalizeBatch');
        if (btnFin) {
          btnFin.onclick = () => finalizeOpenUpiBatch(getActiveParty().id);
        }

        document.querySelectorAll('[data-view-proof]').forEach(btn => {
          btn.onclick = () => {
            previewImageUrl = btn.getAttribute('data-view-proof');
            render();
          };
        });

        const btnCloseProof = document.getElementById('btnCloseProof');
        if (btnCloseProof) {
          btnCloseProof.onclick = () => {
            previewImageUrl = '';
            render();
          };
        }
      }

      render();
    })();
  </script>
</body>
</html>
